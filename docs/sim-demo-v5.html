<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>人生模擬（引擎實跑 v5）｜第三條路</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<style>:root{--bg:#fff;--surface:#f4f4f4;--surface-2:#e8e8e8;--ink:#111;--muted:#6b6b6b;--accent:#1a4be0;--font-display:"Noto Serif TC",serif;--font-text:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:var(--font-text);font-size:17px;line-height:1.6}h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0}.wrap{max-width:72rem;margin:0 auto;padding:2rem 1.25rem 4rem}.box{background:var(--surface);padding:1.25rem}.note{background:#fff8d6;color:#4a3b00;padding:.6rem 1.25rem;font-size:.9rem}
/* 人生模擬播放器（照示意頁 v2，用戶 2026-11-03 同意） */
.sim-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:4px;margin:1rem 0}
.sim-opt{background:var(--bg);text-align:left;padding:.9rem 1.1rem;border:0;cursor:pointer;transition:background-color .18s}
.sim-opt:hover{background:var(--surface-2)}
.sim-opt[aria-pressed=true]{background:var(--accent);color:#fff}
.sim-opt strong{display:block;font-family:var(--font-display);font-size:1.2rem}
.sim-opt span{font-size:.85rem;opacity:.85}
.sim-ctrl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.sim-ctrl button{background:var(--bg);border:0;padding:.55rem 1rem;min-height:2.75rem;cursor:pointer;transition:background-color .18s,transform .14s}
.sim-ctrl button:hover{background:var(--surface-2)}
.sim-ctrl button:active{transform:scale(.96)}
.sim-ctrl button[aria-pressed=true]{background:var(--ink);color:#fff}
.sim-ctrl .go{background:var(--accent);color:#fff}
.sim-ctrl .sp{flex:1}
.sim-stages{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.sim-stage{background:var(--bg);padding:1rem;position:relative;overflow:hidden}
.sim-stage h3{font-size:1.1rem;display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.sim-stage h3 small{font-family:var(--font-text);font-size:.8rem;color:var(--muted);font-weight:400}
.sim-good-t{color:var(--accent)}
.sim-scene{position:relative;height:180px;margin-top:.6rem;background:#dfe7f7;overflow:hidden;transition:background-color 1.2s}
.sim-scene.alt{background:#dff3ec}.sim-scene.old{background:#efe8dc}
.sim-city{position:absolute;bottom:36px;left:0;width:200%;height:86px;opacity:.55;animation:sim-pan 30s linear infinite}
@keyframes sim-pan{to{transform:translateX(-50%)}}
.sim-ground{position:absolute;bottom:0;left:0;right:0;height:36px;background:#c9d2c5}
.sim-who{position:absolute;bottom:28px;left:46%}
.sim-kid{position:absolute;bottom:28px;transition:opacity .8s}
.sim-place{position:absolute;top:.5rem;left:.6rem;font-size:.85rem;background:rgba(255,255,255,.85);padding:.15rem .5rem}
.sim-age{position:absolute;top:.4rem;right:.6rem;font-family:var(--font-display);font-size:2.3rem;line-height:1;text-align:right}
.sim-age small{display:block;font-family:var(--font-text);font-size:.8rem;color:var(--muted)}
.sim-pop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:.92rem;font-weight:500;background:#fff;padding:.3rem .7rem;opacity:0;white-space:nowrap;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.sim-pop.show{animation:sim-pop 1.4s cubic-bezier(.22,1,.36,1) forwards}
.sim-pop.big{background:var(--accent);color:#fff}.sim-pop.hit{background:#111;color:#fff}
@keyframes sim-pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
.sim-bars{display:grid;grid-template-columns:3.2em 1fr 4.6em;gap:.25rem .5rem;align-items:center;margin:.8rem 0;font-size:.85rem}
.sim-bar{height:10px;background:var(--surface);position:relative}
.sim-bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .7s cubic-bezier(.22,1,.36,1)}
.sim-bar.money i{background:var(--accent)}
.sim-bars b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.sim-feed{list-style:none;padding:0;margin:0;display:grid;gap:4px;height:22rem;overflow:hidden;align-content:start}
.sim-feed li{background:var(--surface);padding:.45rem .7rem;font-size:.92rem;display:grid;grid-template-columns:3.4em 1fr;gap:.5rem;animation:sim-in .5s cubic-bezier(.22,1,.36,1)}
.sim-feed li .y{color:var(--muted);font-variant-numeric:tabular-nums}
.sim-feed li.big{background:var(--accent);color:#fff}.sim-feed li.big .y{color:#cfd9ff}
.sim-feed li.hit,.sim-feed li.end{background:#111;color:#fff}.sim-feed li.hit .y,.sim-feed li.end .y{color:#aaa}
.sim-feed li.ff{background:var(--surface-2)}
@keyframes sim-in{from{opacity:0;transform:translateY(-10px)}}
.sim-map{display:grid;grid-template-columns:repeat(25,1fr);gap:2px;margin-top:.8rem}
.sim-map span{aspect-ratio:1;background:var(--surface);transition:background-color .4s}
.sim-maplab{font-size:.8rem;color:var(--muted);margin-top:.3rem;display:flex;justify-content:space-between;gap:.5rem}
.sim-card{position:absolute;inset:0;z-index:5;background:var(--ink);color:#fff;padding:1.3rem;display:flex;flex-direction:column;gap:.7rem;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .6s,transform .6s cubic-bezier(.22,1,.36,1);overflow:auto}
.sim-card.show{opacity:1;pointer-events:auto;transform:none}
.sim-card h4{font-family:var(--font-display);font-size:1.4rem;margin:0}
.sim-card .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.5rem}
.sim-card .row div{background:#222;padding:.6rem}
.sim-card .row b{display:block;font-family:var(--font-display);font-size:1.25rem}
.sim-card .row span{font-size:.8rem;color:#bbb}
.sim-card ul{margin:0;padding-left:1.1rem;font-size:.9rem;display:grid;gap:.2rem}
.sim-card .again{margin-top:auto;align-self:flex-start;background:#fff;color:#111;border:0;padding:.5rem 1rem;cursor:pointer}
.sim-note{font-size:.85rem;color:var(--muted);margin-top:.8rem}
@media(max-width:760px){.sim-stages{grid-template-columns:1fr}.sim-stages[data-one=good] .sim-stage.bad,.sim-stages[data-one=bad] .sim-stage.good{display:none}.sim-map{grid-template-columns:repeat(15,1fr)}}
@media(min-width:761px){.sim-only-m{display:none}}
@media(prefers-reduced-motion:reduce){.sim-city,.sim-pop.show,.sim-feed li{animation:none}}

.sim-family{display:flex;flex-wrap:wrap;gap:.4rem;font-size:.88rem;margin:.6rem 0}
.sim-family span{background:var(--bg);padding:.25rem .6rem}
/* 像素場景和個人資訊（用戶 2026-11-03：8-bit 風、資訊不要太少） */
.sim-scene{height:auto;aspect-ratio:16/9;background:#b9c9ee}
.sim-px{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.sim-place,.sim-age,.sim-pop{z-index:2}
.sim-place{font-weight:500;outline:2px solid #111}
.sim-pop{outline:2px solid #111;top:30%}
.sim-profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem;margin-top:.7rem;font-size:.86rem}
.sim-profile>div{background:var(--surface);padding:.6rem .7rem}
.sim-profile h4{font-family:var(--font-text);font-size:.8rem;font-weight:500;color:var(--muted);margin:0 0 .3rem}
.sim-profile dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.15rem .6rem}
.sim-profile dt{color:var(--muted)}
.sim-profile dd{margin:0}
</style></head><body><p class="note">引擎實跑：國家每年的景氣、貨幣、天災照 200 國資料擲骰，壽命照生命表；每年 5～15 件事一路到過世，人都有名字。情境和選項的參數是假設的（要不要接新加坡外派）。</p><main class="wrap"><section class="box" id="sim"><h2>每條路的人生模擬</h2></section></main><script>// 8-bit 像素場景（用戶 2026-11-03：照 1in8b 的像素風）。邏輯解析度 160×90，用 CSS 放大、像素不模糊。
(function () {
  var W = 160, H = 90;
  // 人物點陣：. 透明、H 頭髮、S 皮膚、E 眼睛、B 衣服、b 衣服暗部、P 褲子、K 鞋、C 拐杖、R 嘴
  var ADULT_M = [
    '....HHHHH...', '...HHHHHHH..', '...HSSSSSH..', '...SESSSES..', '...SSSRSSS..', '....SSSSS...',
    '..bBBBBBBBb.', '.bBBBBBBBBBb', '.SBBBBBBBBBS', '.SBBBBBBBBBS', '.SBBBBBBBBBS', '..BBBBBBBBB.',
    '..PPPPPPPPP.', '..PPPP.PPPP.', '..PPPP.PPPP.', '..PPPP.PPPP.', '..PPPP.PPPP.', '.KKKKK.KKKKK'];
  var ADULT_F = [
    '...HHHHHHH..', '..HHHHHHHHH.', '..HHSSSSSHH.', '..HSESSSESH.', '..HSSSRSSSH.', '..HHSSSSSHH.',
    '..bBBBBBBBb.', '.bBBBBBBBBBb', '.SBBBBBBBBBS', '.SBBBBBBBBBS', '.SBBBBBBBBBS', '..BBBBBBBBB.',
    '..BBBBBBBBB.', '...SSS.SSS..', '...SSS.SSS..', '...SSS.SSS..', '...SSS.SSS..', '..KKKK.KKKK.'];
  var KID = [
    '..HHHHH..', '.HHHHHHH.', '.HSSSSSH.', '.SESSSES.', '.SSSRSSS.', '..bBBBb..', '.SBBBBBS.', '.SBBBBBS.',
    '..PPPPP..', '..PP.PP..', '..PP.PP..', '.KKK.KKK.'];
  var BABY = ['.HHH.', 'HSSSH', 'SESES', '.BBB.', 'SBBBS', '.P.P.'];

  function sprite(ctx, rows, x, y, pal, bob) {
    for (var r = 0; r < rows.length; r++) for (var c = 0; c < rows[r].length; c++) {
      var k = rows[r][c]; if (k === '.') continue;
      var col = pal[k]; if (!col) continue;
      ctx.fillStyle = col; ctx.fillRect(x + c, y + r + (bob && r >= rows.length - 6 && (c % 2) ? 0 : 0), 1, 1);
    }
  }
  function hairOf(age) { return age >= 75 ? '#e8e8e8' : age >= 62 ? '#b9b9b9' : age >= 52 ? '#6d6d6d' : '#2b2118'; }
  function person(ctx, x, y, age, female, shirt, frame) {
    var rows = female ? ADULT_F : ADULT_M;
    var pal = { H: hairOf(age), S: '#f1c9a5', E: '#222', R: '#c0705a', B: shirt, b: shade(shirt), P: female ? shirt : '#2e3a5c', K: '#3a2a20' };
    var stoop = age >= 70 ? 1 : 0, lift = frame % 2;
    // 走路：兩格交替抬腳
    var r2 = rows.slice();
    if (lift) { r2[r2.length - 1] = r2[r2.length - 1].replace(/K/g, (m, i) => (i < 6 ? '.' : 'K')); }
    sprite(ctx, r2.slice(0, 6), x + stoop, y, pal);
    sprite(ctx, r2.slice(6), x, y + 6, pal);
    if (age >= 72) { ctx.fillStyle = '#7a5530'; ctx.fillRect(x + 12, y + 9, 1, 9); ctx.fillRect(x + 11, y + 9, 1, 1); }
  }
  function kid(ctx, x, y, age, female, shirt) {
    if (age < 3) { sprite(ctx, BABY, x, y + 6, { H: '#2b2118', S: '#f1c9a5', E: '#222', B: shirt, P: '#555' }); return; }
    if (age >= 15) { person(ctx, x - 1, y - 6, 20, female, shirt, 0); return; }
    sprite(ctx, KID, x, y, { H: '#2b2118', S: '#f1c9a5', E: '#222', R: '#c0705a', B: shirt, b: shade(shirt), P: female ? shirt : '#3d4a6b', K: '#3a2a20' });
  }
  function shade(hex) { var n = parseInt(hex.slice(1), 16), r = (n >> 16) * 0.75, g = ((n >> 8) & 255) * 0.75, b = (n & 255) * 0.75; return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')'; }

  function rect(ctx, c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
  function sky(ctx, top, bottom) { for (var i = 0; i < 6; i++) rect(ctx, i < 3 ? top : bottom, 0, i * 10, W, 10); }
  function clouds(ctx, t) {
    var x = (t * 0.15) % (W + 40) - 40;
    [[x, 10], [x + 70, 18], [x + 130, 8]].forEach(function (p) { var cx = ((p[0] % (W + 40)) + W + 40) % (W + 40) - 20; rect(ctx, '#ffffff', cx, p[1], 14, 3); rect(ctx, '#ffffff', cx + 3, p[1] - 2, 8, 2); });
  }
  function taipei(ctx) {
    var bs = [[4, 30], [16, 24], [26, 34], [40, 20], [52, 28], [96, 26], [108, 36], [120, 22], [134, 30], [146, 24]];
    bs.forEach(function (b, i) { rect(ctx, i % 2 ? '#8892b0' : '#7a84a6', b[0], 62 - b[1], 10, b[1]); for (var y = 62 - b[1] + 3; y < 60; y += 5) { rect(ctx, '#c9d3f0', b[0] + 2, y, 2, 2); rect(ctx, '#c9d3f0', b[0] + 6, y, 2, 2); } });
    // 101：一節一節往上
    var x = 72; for (var s = 0; s < 8; s++) rect(ctx, '#5b6a8f', x + 1, 58 - s * 6, 12, 6), rect(ctx, '#6f7fa6', x, 58 - s * 6, 14, 1);
    rect(ctx, '#5b6a8f', x + 4, 6, 6, 6); rect(ctx, '#5b6a8f', x + 6, 1, 2, 5);
  }
  function singapore(ctx) {
    var bs = [[4, 26], [18, 32], [30, 22], [118, 30], [132, 24], [146, 34]];
    bs.forEach(function (b, i) { rect(ctx, i % 2 ? '#7f9a96' : '#6f8a86', b[0], 62 - b[1], 11, b[1]); for (var y = 62 - b[1] + 3; y < 60; y += 5) rect(ctx, '#d5ece7', b[0] + 3, y, 5, 2); });
    // 濱海灣金沙：三棟加頂上的船
    [56, 74, 92].forEach(function (x) { rect(ctx, '#4f6f6a', x, 28, 9, 34); rect(ctx, '#5f807b', x + 1, 30, 2, 30); });
    rect(ctx, '#3f5a56', 50, 25, 56, 3); rect(ctx, '#3f5a56', 104, 26, 4, 2);
  }
  function park(ctx) {
    [[14, 0], [40, 1], [118, 0], [144, 1]].forEach(function (t) { rect(ctx, '#6b4a2b', t[0] + 4, 44, 3, 18); rect(ctx, t[1] ? '#3f7a3a' : '#4f8a46', t[0], 30, 11, 15); rect(ctx, '#5c9a52', t[0] + 2, 27, 7, 4); });
    rect(ctx, '#8a6a44', 96, 54, 16, 2); rect(ctx, '#6b4a2b', 97, 56, 2, 6); rect(ctx, '#6b4a2b', 109, 56, 2, 6);
  }
  function ground(ctx, kind) {
    rect(ctx, kind === 'park' ? '#7fae6a' : '#9aa59a', 0, 62, W, 28);
    rect(ctx, kind === 'park' ? '#6f9e5a' : '#8a958a', 0, 62, W, 2);
    for (var x = 0; x < W; x += 8) rect(ctx, kind === 'park' ? '#8fbe7a' : '#a9b4a9', x, 70 + (x % 16 ? 6 : 0), 4, 1);
  }

  window.PixelScene = function (canvas) {
    var ctx = canvas.getContext('2d'); canvas.width = W; canvas.height = H; ctx.imageSmoothingEnabled = false;
    var state = { city: '台灣', age: 40, retired: false, spouse: true, spouseFemale: true, kids: [], female: false }, t = 0, raf = null;
    function draw() {
      t++;
      var old = state.age >= 63, kind = old ? 'park' : state.city === '新加坡' ? 'sg' : 'tw';
      if (kind === 'sg') sky(ctx, '#bfe3dc', '#d8efe9'); else if (kind === 'park') sky(ctx, '#f2dfc2', '#f7ead6'); else sky(ctx, '#b9c9ee', '#d3ddf6');
      clouds(ctx, t);
      if (kind === 'tw') taipei(ctx); else if (kind === 'sg') singapore(ctx); else park(ctx);
      ground(ctx, kind === 'park' ? 'park' : 'city');
      var frame = Math.floor(t / 20), x = 62;
      person(ctx, x, 46, state.age, state.female, '#1a4be0', frame);
      if (state.spouse) person(ctx, x + 15, 46, state.age - 2, state.spouseFemale, '#c2504a', frame + 1);
      state.kids.forEach(function (k, i) { if (k.age < 25) kid(ctx, x + 32 + i * 11, 52, k.age, k.female, i ? '#e0a43a' : '#3a9a6a'); });
      raf = requestAnimationFrame(draw);
    }
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) draw(); else { t = 0; draw(); cancelAnimationFrame(raf); }
    return { set: function (s) { Object.assign(state, s); if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { cancelAnimationFrame(raf); draw(); cancelAnimationFrame(raf); } }, stop: function () { cancelAnimationFrame(raf); } };
  };
})();

// 人生模擬播放器：讀引擎產出的 人生模擬.json（engine/simulate.js），8-bit 像素場景（pixel.js）。
// case.js 有 人生模擬.json 時呼叫 window.renderSim(root, data)。
window.renderSim = function (root, data) {
  if (!data || !data.options || !data.options.length) return;
  var cur = 0, step = 0, maxStep = 0, timer = null, speed = 1, SPEEDS = [1, 2, 4, 8], scenes = {};
  var FAM = {}; (data.family || []).forEach(function (p) { FAM[p[0]] = p[1]; });
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  root.insertAdjacentHTML('beforeend',
    '<div class="sim-opts" role="group" aria-label="選一個選項">' + data.options.map(function (o, i) { return '<button class="sim-opt" data-i="' + i + '" aria-pressed="' + (i === 0) + '"><strong>' + esc(o.id + '　' + o.name) + '</strong><span>' + esc(o.sub || '') + '</span></button>'; }).join('') + '</div>' +
    '<div class="sim-ctrl"><button class="go sim-play">播放</button><button class="sim-spd">速度 1×</button><button class="sim-skip">跳到結局</button><span class="sp"></span><button class="sim-only-m" data-one="good" aria-pressed="true">運氣好</button><button class="sim-only-m" data-one="bad" aria-pressed="false">運氣差</button></div>' +
    '<div class="sim-stages" data-one="good"><section class="sim-stage good" aria-label="運氣好的那一段"></section><section class="sim-stage bad" aria-label="運氣差的那一段"></section></div>' +
    '<p class="sim-note">每條路跑了 ' + data.runs + ' 次，挑出排在前兩成和後兩成附近的兩段。人生選擇一律保守，好壞只來自外在的運氣。金額都換算成今天的錢；數字是示意，不是預測。</p>');
  var Q = function (s) { return root.querySelector(s); };

  function profileHtml(y) {
    var p = y.profile || {}, kidF = (data.family || []).filter(function (f) { return /小的|大的|小孩/.test(f[0]); });
    var me = [['年紀', y.age + ' 歲，住' + y.city], ['工作', (p.title || '') + (p.income ? '，年收入約 ' + p.income + ' 萬' : '')], ['存款', y.stats.m + ' 萬'], ['身體', p.health || '']];
    var fam = [];
    if (p.sp) fam.push(['另一半', FAM['另一半'] + '，' + (p.sp.status === '已過世' ? '已過世' : p.sp.age + ' 歲，' + p.sp.status)]);
    (p.kids || []).forEach(function (k, i) { var f = kidF[i]; fam.push([f ? f[0].replace(/（.*）/, '') : '小孩', (f ? f[1] + '，' : '') + k.age + ' 歲，' + k.status]); });
    (p.parents || []).forEach(function (pp) { var lab = pp.id === 'father' ? '爸爸' : '媽媽'; fam.push([lab, FAM[lab] + '，' + (pp.status === '已過世' ? '已過世' : pp.age + ' 歲，' + pp.status)]); });
    var near = [];
    if (p.boss) near.push(['主管', p.boss]);
    if (p.cws && p.cws.length) near.push(['同事', p.cws.join('、')]);
    if (p.friends && p.friends.length) near.push(['好朋友', p.friends.join('、')]);
    function dl(title, r) { return '<div><h4>' + title + '</h4><dl>' + r.map(function (x) { return '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl></div>'; }
    return dl('你', me) + dl('家人', fam) + (near.length ? dl('身邊的人', near) : '');
  }

  function build(k) {
    var L = data.options[cur][k], st = Q('.sim-stage.' + k), y0 = L.years[0];
    if (scenes[k]) scenes[k].stop();
    st.innerHTML = '<h3><span class="' + (k === 'good' ? 'sim-good-t' : '') + '">' + (k === 'good' ? '運氣好的那一段' : '運氣差的那一段') + '</span><small>不是最' + (k === 'good' ? '好' : '慘') + '的那次</small></h3>' +
      '<div class="sim-scene"><canvas class="sim-px" aria-hidden="true"></canvas><span class="sim-place">' + esc(y0.city) + '</span><div class="sim-age">' + y0.age + '<small>' + y0.year + '</small></div><div class="sim-pop" aria-live="polite"></div></div>' +
